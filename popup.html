<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnet 链接清理</title>
<style>
*{box-sizing:border-box}body{width:390px;max-width:100vw;margin:0;padding:18px;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#193443;background:#f3f7f8}h1{font-size:19px;margin:0 0 5px}p{margin:0 0 14px;color:#526773;font-size:12px}label{display:block;font-weight:650;margin:12px 0 5px}textarea{display:block;width:100%;height:106px;resize:vertical;border:1px solid #b9cbd2;border-radius:8px;padding:9px;font:12px/1.5 ui-monospace,Consolas,monospace;color:#193443}button{cursor:pointer;padding:8px 13px;border:1px solid #14796c;border-radius:7px;background:#fff;color:#14796c;font:inherit}button.primary{background:#14796c;color:white}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}#status{min-height:20px;margin-top:8px;color:#326b61;font-size:12px}
</style>
<h1>手动清理 Magnet</h1>
<p>自动检测未弹出时，在这里粘贴链接。内容仅在当前窗口处理。</p>
<label for="source">原始链接</label><textarea id="source" spellcheck="false" placeholder="粘贴 magnet:? 链接"></textarea>
<div class="row"><button id="paste">粘贴</button><button id="clean" class="primary">简化</button></div>
<label for="result">规范化结果</label><textarea id="result" readonly spellcheck="false"></textarea>
<div class="row"><button id="copy" disabled>复制结果</button></div>
<div id="status" role="status" aria-live="polite"></div>
<script src="cleaner.js"></script><script src="popup.js"></script>
</html>
